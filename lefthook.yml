# Git hooks, installed by `pnpm install` (the root `prepare` script runs
# `lefthook install`). Skip once with `LEFTHOOK=0 git commit …`; never commit
# with --no-verify to dodge a real failure.

pre-commit:
  parallel: true
  jobs:
    # Lint + format + organise imports on the staged files only, write the
    # safe fixes, and re-stage them. Unsafe fixes are never applied here.
    - name: biome
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,graphql,svg}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    # A changed manifest without the matching lockfile change breaks
    # `pnpm install --frozen-lockfile` in CI and Docker.
    - name: lockfile
      glob: "{package.json,*/package.json,pnpm-workspace.yaml}"
      run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts --silent

commit-msg:
  jobs:
    # Conventional Commits (commitlint.config.mjs).
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: biome
      run: pnpm exec biome ci --changed --since=origin/master --no-errors-on-unmatched
    - name: typecheck
      run: pnpm typecheck
