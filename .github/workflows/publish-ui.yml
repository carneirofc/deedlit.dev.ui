name: Publish UI package

# Builds and publishes @carneirofc/ui to GitHub Packages when a GitHub Release
# is published. The release tag (e.g. v0.2.0) drives the published version, so
# the npm version always matches the Release.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@carneirofc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing @carneirofc/ui@${VERSION}"
          cd deedlit.dev.ui
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build UI package
        run: pnpm build:ui

      - name: Publish to GitHub Packages
        run: pnpm --filter @carneirofc/ui publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
